<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Prefect QR Attendance</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://unpkg.com/html5-qrcode" defer></script>
  <script src="app.js" defer></script>

</head>

<body>

<div class="container">

    <h1>Samarasingharama Dhamma School</h1>

    <h2>QR Attendance Scanner</h2>

    <div id="reader"></div>

    <div id="status">
        Ready to Scan
    </div>

    <div id="lastScan">
        No Scan
    </div>

    <button onclick="startScanner()">
        Start Scanner
    </button>

</div>

</body>
</html>
